<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" fill="none">
  <rect width="840" height="390" rx="16" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="839" height="389" rx="15.5" stroke="#262D38"/>

  <!-- Header -->
  <text x="32" y="42" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700">RAM Footprint: Idle vs. Active Dictation</text>
  <text x="32" y="68" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Measured on Apple M5 (16 GB) via macOS footprint · weights unload 10s after dictation</text>

  <!-- Highlight Pill -->
  <rect x="614" y="22" width="194" height="30" rx="15" fill="#132D21" stroke="#238636"/>
  <text x="711" y="41.5" text-anchor="middle" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">34.9× less idle RAM</text>

  <!-- Row 1: Fluid Idle -->
  <text x="32" y="114" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Fluid Dictation (Idle, Model Unloaded)</text>
  <text x="32" y="132" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">21 MB menu-bar app + 10 MB Python coordinator · 0 MB model weights</text>
  <text x="808" y="114" text-anchor="end" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">31 MB</text>
  <rect x="32" y="142" width="776" height="22" rx="6" fill="#161B22"/>
  <rect x="32" y="142" width="14" height="22" rx="6" fill="#3FB950"/>

  <!-- Row 2: Wispr Flow Idle -->
  <text x="32" y="194" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Wispr Flow (Idle, Not Recording)</text>
  <text x="32" y="212" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">13 background processes · 585 MB Electron main/helpers + 496 MB renderers</text>
  <text x="808" y="194" text-anchor="end" fill="#F0883E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">1,081 MB</text>
  <rect x="32" y="222" width="776" height="22" rx="6" fill="#161B22"/>
  <rect x="32" y="222" width="260" height="22" rx="6" fill="#D29922"/>
  <rect x="286" y="222" width="216" height="22" rx="6" fill="#F0883E"/>
  <rect x="286" y="222" width="10" height="22" fill="#F0883E"/>

  <!-- Row 3: Fluid Active 10s -->
  <text x="32" y="274" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Fluid Dictation (Active Peak, 10s Dictation)</text>
  <text x="32" y="292" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">1,255 MB local 8-bit MLX peak (0.92s cold, 0.78s warm) · drops to 31 MB after 10s</text>
  <text x="808" y="274" text-anchor="end" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">1,286 MB</text>
  <rect x="32" y="302" width="776" height="22" rx="6" fill="#161B22"/>
  <rect x="32" y="302" width="18" height="22" rx="6" fill="#3FB950"/>
  <rect x="46" y="302" width="546" height="22" rx="6" fill="#58A6FF"/>
  <rect x="46" y="302" width="10" height="22" fill="#58A6FF"/>

  <!-- Footer / Legend -->
  <line x1="32" y1="344" x2="808" y2="344" stroke="#21262D"/>
  <rect x="32" y="358" width="10" height="10" rx="2" fill="#3FB950"/>
  <text x="47" y="367" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Fluid Host</text>
  <rect x="122" y="358" width="10" height="10" rx="2" fill="#58A6FF"/>
  <text x="137" y="367" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Fluid MLX Model</text>
  <rect x="248" y="358" width="10" height="10" rx="2" fill="#D29922"/>
  <text x="263" y="367" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Wispr Helpers</text>
  <rect x="364" y="358" width="10" height="10" rx="2" fill="#F0883E"/>
  <text x="379" y="367" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Wispr Renderers</text>
  <text x="808" y="367" text-anchor="end" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">5-min stress peak: 1,688 MB</text>
</svg>
